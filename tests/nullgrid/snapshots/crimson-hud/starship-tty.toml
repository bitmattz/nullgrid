# Generated by nullgrid from starship.toml.j2. Do not edit: changes are overwritten.
# Customize ~/.config/nullgrid/nullgrid.toml or override the template instead.
# Linux console variant: only glyphs the console font has, colors from the 16-color palette.
"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
format = '''
[┌─\[](bold 6)$username[@](6)$hostname[\]─\[](bold 6)$directory[\]](bold 6)$git_branch$git_status$cmd_duration$status
[└─](bold 6)$character'''

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold 15"
style_root = "bold 1"

[hostname]
ssh_only = false
format = "[$hostname]($style)"
style = "15"

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "bold 6"
read_only = " RO"
read_only_style = "1"
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
format = "[─\\[](bold 6)[$branch]($style)[\\]](bold 6)"
style = "1"

[git_status]
format = "( [$all_status$ahead_behind]($style))"
style = "3"

[cmd_duration]
min_time = 2000
format = "[─\\[](bold 6)[$duration]($style)[\\]](bold 6)"
style = "3"

[status]
disabled = false
format = "[─\\[](bold 6)[ERR $status]($style)[\\]](bold 6)"
style = "bold 1"

[character]
success_symbol = "[»](bold 6)"
error_symbol = "[»](bold 1)"
