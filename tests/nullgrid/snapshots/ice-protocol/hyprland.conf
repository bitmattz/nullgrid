# Generated by nullgrid from hyprland.conf.j2. Do not edit: changes are overwritten.
# Customize ~/.config/nullgrid/nullgrid.toml or override the template instead.
# Sourced from hyprland.conf. The $ng_* variables are for the rest of the config.

$ng_bg        = rgba(070a0fff)
$ng_surface   = rgba(0f1824d9)
$ng_primary   = rgba(8fd8ffff)
$ng_secondary = rgba(3d7bffff)
$ng_glow      = rgba(6fb6ffff)
$ng_text      = rgba(eef6ffff)
$ng_dim       = rgba(6b7d90ff)
$ng_warning   = rgba(ffc857ff)
$ng_font_ui   = Rajdhani
$ng_font_mono = JetBrains Mono

general {
    border_size = 2
    gaps_in = 4
    gaps_out = 8
    col.active_border = rgba(6fb6ffff) rgba(3d7bffff) 45deg
    col.inactive_border = rgba(6b7d9059)
}

decoration {
    # Hyprland can't cut corners, so "chamfer" windows are square; panels get the chamfers.
    rounding = 0

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 10
        render_power = 2
        color = rgba(6fb6ff38)
        color_inactive = rgba(070a0f66)
    }
}

animations {
    enabled = true
    # Quick, slightly mechanical: fast start, hard stop. Speeds are in deciseconds.
    bezier = ng_mech, 0.2, 0.9, 0.1, 1.0
    bezier = ng_snap, 0.5, 0, 0.1, 1.0
    animation = windows, 1, 1.8, ng_mech, popin 92%
    animation = windowsOut, 1, 1.2, ng_snap, popin 92%
    animation = border, 1, 2.2, ng_mech
    animation = fade, 1, 1.5, ng_mech
    animation = workspaces, 1, 2.0, ng_mech, slide
}
