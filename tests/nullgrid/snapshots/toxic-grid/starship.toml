# Generated by nullgrid from starship.toml.j2. Do not edit: changes are overwritten.
# Customize ~/.config/nullgrid/nullgrid.toml or override the template instead.
# Desktop variant (kitty): angular powerline segments.
"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
palette = "nullgrid"
format = '''
[╭─](primary)[](primary)$username$hostname[](fg:primary bg:surface)$directory[](fg:surface bg:bg_alt)$git_branch$git_status[](fg:bg_alt)$cmd_duration$status$fill$time
[╰─](primary)$character'''

[palettes.nullgrid]
bg = "#050605"
bg_alt = "#0c110a"
surface = "#10160d"
primary = "#b6ff3b"
secondary = "#f4e409"
glow = "#9dff00"
text = "#eaf5e0"
dim = "#6f7d66"
warning = "#ff9f1c"

[username]
show_always = true
format = "[ $user]($style)"
style_user = "bg:primary fg:bg bold"
style_root = "bg:secondary fg:bg bold"

[hostname]
ssh_only = false
format = "[@$hostname ]($style)"
style = "bg:primary fg:bg"

[directory]
format = "[ $path]($style)[$read_only]($read_only_style)[ ](bg:surface)"
style = "bg:surface fg:primary bold"
read_only = " RO"
read_only_style = "bg:surface fg:secondary"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
format = "[ $symbol$branch ]($style)"
style = "bg:bg_alt fg:secondary"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "bg:bg_alt fg:warning"

[cmd_duration]
min_time = 2000
format = "[ $duration]($style)"
style = "fg:warning"

[status]
disabled = false
format = "[ ERR $status]($style)"
style = "fg:secondary bold"

[fill]
symbol = " "

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style)"
style = "fg:dim"

[character]
success_symbol = "[›](bold primary)"
error_symbol = "[›](bold secondary)"
