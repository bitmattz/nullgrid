# Generated by nullgrid from tmux.conf.j2. Do not edit: changes are overwritten.
# Customize ~/.config/nullgrid/nullgrid.toml or override the template instead.
# Sourced from tmux.conf. Colors are terminal palette slots, so this works on the console too.

set -g status-style "bg=default,fg=colour8"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=colour0,bg=colour2,bold] NG #[fg=colour2,bg=default,nobold] #S #[fg=colour8]│ "
set -g status-right "#[fg=colour8]│ #[fg=colour15]#H #[fg=colour8]│ #[fg=colour2]%Y-%m-%d %H:%M "
set -g window-status-format "#[fg=colour8] #I:#W "
set -g window-status-current-format "#[fg=colour0,bg=colour3,bold] #I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour2"
set -g message-style "fg=colour2,bg=colour0"
set -g message-command-style "fg=colour3,bg=colour0"
set -g mode-style "fg=colour0,bg=colour2"
set -g clock-mode-colour "colour2"
set -g display-panes-active-colour "colour2"
set -g display-panes-colour "colour8"
