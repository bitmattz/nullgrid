# Generated by nullgrid from starship.toml.j2. Do not edit: changes are overwritten.
# Customize ~/.config/nullgrid/nullgrid.toml or override the template instead.
# Linux console variant: only glyphs the console font has, colors from the 16-color palette.
"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
format = '''
[┌─\[](bold 2)$username[@](2)$hostname[\]─\[](bold 2)$directory[\]](bold 2)$git_branch$git_status$cmd_duration$status
[└─](bold 2)$character'''

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold 15"
style_root = "bold 3"

[hostname]
ssh_only = false
format = "[$hostname]($style)"
style = "15"

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "bold 2"
read_only = " RO"
read_only_style = "3"
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
format = "[─\\[](bold 2)[$branch]($style)[\\]](bold 2)"
style = "3"

[git_status]
format = "( [$all_status$ahead_behind]($style))"
style = "11"

[cmd_duration]
min_time = 2000
format = "[─\\[](bold 2)[$duration]($style)[\\]](bold 2)"
style = "11"

[status]
disabled = false
format = "[─\\[](bold 2)[ERR $status]($style)[\\]](bold 2)"
style = "bold 3"

[character]
success_symbol = "[»](bold 2)"
error_symbol = "[»](bold 3)"
