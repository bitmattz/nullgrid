# Serial console autologin lets `make test-boot` drive the VM headlessly.
# No -o/--login-options here: they would replace the `-f` that skips the password.
[Service]
# getty is Type=idle: it waits (up to 5 s) until no other boot job runs. On the live ISO
# pacman-init runs for ~7 s, so the desktop came up 5 s late. With the splash, nothing needs it.
Type=simple
ExecStart=
ExecStart=-/sbin/agetty --noreset --noclear --keep-baud --autologin nullgrid 115200,57600,38400,9600 - ${TERM}
