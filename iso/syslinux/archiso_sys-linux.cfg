LABEL nullgrid
TEXT HELP
Boot the NULLGRID live system on BIOS.
ENDTEXT
MENU LABEL NULLGRID live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 quiet splash plymouth.ignore-serial-consoles %KERNEL_PARAMS%

LABEL nullgrid-verbose
TEXT HELP
Boot the NULLGRID live system on BIOS, showing boot messages instead of the splash.
ENDTEXT
MENU LABEL NULLGRID live (%ARCH%, BIOS, boot messages)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 plymouth.enable=0 %KERNEL_PARAMS%
