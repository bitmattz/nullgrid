# NULLGRID default theme: dark crimson, neon cyan accents, red-pink window glow.
# Every key under [fonts] and [style] is optional (the defaults are in docs/CUSTOMIZING.md).

[meta]
name = "crimson-hud"
description = "dark crimson, neon cyan, red-pink glow (default)"
author = "NULLGRID"

[colors]
bg        = "#1a0b0f"
bg_alt    = "#2a0f15"
surface   = "#24111a"
primary   = "#5ef2f2"
secondary = "#ff3b4e"
glow      = "#ff4d6d"
text      = "#e6f7f7"
dim       = "#7a8a8f"
warning   = "#ffd166"

[colors.terminal]
foreground = "#e6f7f7"
background = "#1a0b0f"
cursor     = "#5ef2f2"
selection  = "#4a1a26"
color0  = "#2b1219"   # black
color1  = "#ff3b4e"   # red
color2  = "#3ddc97"   # green
color3  = "#ffd166"   # yellow
color4  = "#4aa8ff"   # blue
color5  = "#ff4d9d"   # magenta
color6  = "#5ef2f2"   # cyan
color7  = "#b8c7cb"   # white
color8  = "#5a3a44"   # bright black
color9  = "#ff6b7a"
color10 = "#6ff0b5"
color11 = "#ffe29a"
color12 = "#7cc2ff"
color13 = "#ff85bd"
color14 = "#9cf8f8"
color15 = "#f4fdfd"

[fonts]
ui      = "Rajdhani"
mono    = "JetBrains Mono"
display = "Orbitron"

[style]
corners = "chamfer"
glow    = 0.6
