[build-system]
requires = ["flit_core>=3.9"]
build-backend = "flit_core.buildapi"

[project]
name = "nullgrid"
dynamic = ["version", "description"]
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1", "tomlkit>=0.12"]
license = { text = "MIT" }

[project.scripts]
nullgrid = "nullgrid.cli:main"
