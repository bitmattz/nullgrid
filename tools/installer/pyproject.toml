[build-system]
requires = ["flit_core>=3.9"]
build-backend = "flit_core.buildapi"

[project]
name = "nullgrid_install"
dynamic = ["version", "description"]
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]
license = { text = "MIT" }

[project.scripts]
nullgrid-install = "nullgrid_install.cli:main"
nullgrid-welcome = "nullgrid_install.welcome:main"
