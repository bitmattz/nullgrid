# NULLGRID kitty config. Colors, fonts and opacity come from the theme engine:
include nullgrid-theme.conf
# Anything below overrides the theme. `nullgrid theme ...` reloads running kittys.

window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width 110c
initial_window_height 32c

cursor_shape beam
cursor_blink_interval 0.6
scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0.1

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {index}:{title} "

# Built-in Nerd Font symbols cover the prompt's segment glyphs.
symbol_map U+E0A0-U+E0D7 Symbols Nerd Font Mono
