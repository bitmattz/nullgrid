# NULLGRID lock screen (hyprlock): "system locked" HUD. This file is yours to edit.
# Colors and fonts come from the generated nullgrid-hyprlock.conf ($ng_* variables), so the lock
# screen follows `nullgrid theme set`. hyprlock reads both files each time it locks.
source = ~/.config/hypr/nullgrid-hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = false
}

animations {
    enabled = true
    bezier = ng_mech, 0.2, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 2, ng_mech
    animation = fadeOut, 1, 2, ng_mech
}

# the current wallpaper (nullgrid wallpaper apply keeps this link), dimmed and blurred
background {
    path = ~/.cache/nullgrid/wallpaper/current.png
    color = $ng_bg
    blur_passes = 2
    blur_size = 4
    brightness = 0.45
}

# the frame
shape {
    size = 640, 360
    color = $ng_surface
    border_size = $ng_border
    border_color = $ng_primary
    rounding = $ng_rounding
    position = 0, 0
    halign = center
    valign = center
}
shape {
    size = 6, 120
    color = $ng_secondary
    rounding = 0
    border_size = 0
    position = -320, 80
    halign = center
    valign = center
}

label {
    text = SYSTEM LOCKED
    color = $ng_primary
    font_family = $ng_font_display
    font_size = 30
    position = 0, 120
    halign = center
    valign = center
}
label {
    text = // AUTHENTICATION REQUIRED //
    color = $ng_secondary
    font_family = $ng_font_mono
    font_size = 12
    position = 0, 78
    halign = center
    valign = center
}
label {
    text = cmd[update:1000] date +%H:%M:%S
    color = $ng_text
    font_family = $ng_font_mono
    font_size = 44
    position = 0, 14
    halign = center
    valign = center
}
label {
    text = cmd[update:60000] echo "OPERATOR $USER  //  NODE $(cat /etc/hostname)  //  $(date +%Y-%m-%d)"
    color = $ng_dim
    font_family = $ng_font_mono
    font_size = 10
    position = 0, -36
    halign = center
    valign = center
}

input-field {
    size = 380, 44
    outline_thickness = 2
    outer_color = $ng_primary
    inner_color = $ng_bg
    font_color = $ng_text
    font_family = $ng_font_mono
    check_color = $ng_warning
    fail_color = $ng_secondary
    capslock_color = $ng_warning
    rounding = $ng_rounding
    dots_size = 0.25
    dots_spacing = 0.4
    fade_on_empty = false
    placeholder_text = <span foreground="##$ng_dim_bare">ENTER PASSPHRASE</span>
    fail_text = ACCESS DENIED  ($ATTEMPTS)
    position = 0, -96
    halign = center
    valign = center
}

# only on the live ISO: how to get back in
label {
    text = cmd[update:0] cat /etc/nullgrid/lock-hint 2>/dev/null
    color = $ng_warning
    font_family = $ng_font_mono
    font_size = 11
    position = 0, -150
    halign = center
    valign = center
}

label {
    text = NG-UNIT 04 // SECTOR 7F // NODE 2.2
    color = $ng_dim
    font_family = $ng_font_mono
    font_size = 9
    position = -24, 18
    halign = right
    valign = bottom
}
