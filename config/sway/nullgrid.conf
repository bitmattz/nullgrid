# NULLGRID Sway defaults: /usr/share/nullgrid/sway/nullgrid.conf (nullgrid-desktop package).
# Sway is the fallback session (GPUs where Hyprland fails) and the [performance] lite one.
# ~/.config/sway/config includes this first, then the generated look and keybinds.

output * scale 1
input type:keyboard xkb_layout us
input type:touchpad {
    tap enabled
    natural_scroll disabled
    dwt enabled
}

focus_follows_mouse yes
xwayland enable

# The terminal opened at login floats left of center: the HUD decor stays visible around it.
for_window [app_id="^nullgrid-welcome$"] floating enable, resize set 44 ppt 58 ppt, move position 15 ppt 18 ppt

# NULLGRID's own popups open floating and centered.
for_window [app_id="^nullgrid-(keys|dash|btop)$"] floating enable, resize set 960 640, move position center

# D-Bus activated services (notifications, portals) need to find this session.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec nullgrid wallpaper apply --quiet
# bar, dock, HUD widgets, start menu, notifications
exec nullgrid-shell
exec nullgrid-sfx daemon
