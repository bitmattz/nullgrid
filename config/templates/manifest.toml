# Generated files: one table per target. Field reference: tools/nullgrid/nullgrid/render.py
# Override or extend in ~/.config/nullgrid/templates/manifest.toml (same format;
# `enabled = false` turns a target off). Placeholders: {config_home} {config_dir} {data_home} {home}.
#
# Apps that can't hot-reload a file pick it up when they next start; their configs
# (written in later phases) include these fragments rather than being generated whole.

[kitty]
template = "kitty.conf.j2"
target = "{config_home}/kitty/nullgrid-theme.conf"
process = "kitty"
signal = "USR1"                       # kitty re-reads its config on SIGUSR1

[hyprland]
# Hyprland 0.55+ reads Lua: ~/.config/hypr/hyprland.lua loads this and the keys file.
template = "hyprland.lua.j2"
target = "{config_home}/hypr/nullgrid-theme.lua"
reload = ["hyprctl", "reload", "config-only"]
env = "HYPRLAND_INSTANCE_SIGNATURE"

[hyprland-keys]
template = "hyprland-keys.lua.j2"
target = "{config_home}/hypr/nullgrid-keys.lua"
reload = ["hyprctl", "reload", "config-only"]
env = "HYPRLAND_INSTANCE_SIGNATURE"

[sway]
# The fallback / lite session. ~/.config/sway/config includes both files.
template = "sway.conf.j2"
target = "{config_home}/sway/nullgrid-theme"
reload = ["swaymsg", "reload"]
env = "SWAYSOCK"

[sway-keys]
template = "sway-keys.conf.j2"
target = "{config_home}/sway/nullgrid-keys"
reload = ["swaymsg", "reload"]
env = "SWAYSOCK"

[wallpaper]
# Input of the wallpaper generator; a change re-renders it on every screen.
template = "wallpaper.json.j2"
target = "{config_dir}/generated/wallpaper.json"
reload = ["nullgrid", "wallpaper", "apply"]
env = "WAYLAND_DISPLAY"

[hyprlock]
template = "hyprlock.conf.j2"
target = "{config_home}/hypr/nullgrid-hyprlock.conf"

[quickshell]
# The desktop shell (shell/, nullgrid-shell) watches this file and restyles on change.
template = "theme.json.j2"
target = "{config_dir}/generated/theme.json"

[sfx]
# The sound daemon (nullgrid-sfx) reads [sound] from here; SIGHUP makes it re-read the file.
template = "sfx.json.j2"
target = "{config_dir}/generated/sfx.json"
process = "nullgrid-sfx"
signal = "HUP"

[fuzzel]
template = "fuzzel.ini.j2"
target = "{config_home}/fuzzel/fuzzel.ini"

[btop]
template = "btop.theme.j2"
target = "{config_home}/btop/themes/nullgrid.theme"

[nvim]
template = "nvim-palette.lua.j2"
target = "{config_home}/nvim/lua/nullgrid/palette.lua"

[toolkit]
# Input of `nullgrid toolkit apply`: icon theme + cursors in ~/.local/share/icons/NULLGRID/
# (generated in the theme colors), and the desktop settings GTK reads (gsettings).
template = "toolkit.json.j2"
target = "{config_dir}/generated/toolkit.json"
reload = ["nullgrid", "toolkit", "apply", "--reload", "--quiet"]

[gtk]
# The NULLGRID GTK theme. GTK re-reads a theme only when its name changes; the toolkit hook
# (same command, so it runs once) flips the name and back.
template = "gtk3.css.j2"
target = "{data_home}/themes/NULLGRID/gtk-3.0/gtk.css"
reload = ["nullgrid", "toolkit", "apply", "--reload", "--quiet"]

[gtk-dark]
# GTK 3 loads this one when an app asks for the dark variant
template = "gtk3.css.j2"
target = "{data_home}/themes/NULLGRID/gtk-3.0/gtk-dark.css"
reload = ["nullgrid", "toolkit", "apply", "--reload", "--quiet"]

[gtk4]
template = "gtk4.css.j2"
target = "{data_home}/themes/NULLGRID/gtk-4.0/gtk.css"
reload = ["nullgrid", "toolkit", "apply", "--reload", "--quiet"]

[qt]
template = "qt6ct-colors.conf.j2"
target = "{config_home}/qt6ct/colors/nullgrid.conf"

[qt-style]
template = "qt6ct.qss.j2"
target = "{config_home}/qt6ct/qss/nullgrid.qss"

[qt6ct]
# Written last of the Qt files: qt6ct sees this directory change and restyles running apps.
template = "qt6ct.conf.j2"
target = "{config_home}/qt6ct/qt6ct.conf"

[zathura]
# Included by ~/.config/zathura/zathurarc. Running viewers re-read it over D-Bus (`:source`).
template = "zathura.j2"
target = "{config_home}/zathura/nullgrid-theme"
process = "zathura"
reload = ["sh", "-c", "for n in $(busctl --user list --no-legend | awk '/^org.pwmt.zathura/ {print $1}'); do busctl --user call $n /org/pwmt/zathura org.pwmt.zathura ExecuteCommand s source; done"]

[tty]
# Linux console palette. Sourced at TTY login; applied immediately when
# `nullgrid theme ...` runs on a console.
template = "tty-palette.sh.j2"
target = "{config_dir}/generated/tty-palette.sh"
reload = ["sh", "{target}"]
env = "TERM=linux"
terminal = true

[shell-env]
# Settings as environment variables, read at shell startup (no Python on the login path).
template = "shell-env.sh.j2"
target = "{config_dir}/generated/shell-env.sh"

[starship]
template = "starship.toml.j2"
target = "{config_home}/starship.toml"
vars = { tty = false }

[starship-tty]
template = "starship.toml.j2"
target = "{config_home}/starship-tty.toml"
vars = { tty = true }

[fastfetch]
template = "fastfetch.jsonc.j2"
target = "{config_home}/fastfetch/config.jsonc"

[tmux]
template = "tmux.conf.j2"
target = "{config_home}/tmux/nullgrid-theme.conf"
process = "tmux: server"
reload = ["tmux", "source-file", "{config_home}/tmux/tmux.conf"]

[yazi]
template = "yazi-theme.toml.j2"
target = "{config_home}/yazi/theme.toml"
vars = { tty = false }

[yazi-tty]
# Used on the console via YAZI_CONFIG_HOME (no icon glyphs there).
template = "yazi-theme.toml.j2"
target = "{config_home}/yazi-tty/theme.toml"
vars = { tty = true }

[lazygit]
template = "lazygit.yml.j2"
target = "{config_home}/lazygit/config.yml"

[cava]
template = "cava.j2"
target = "{config_home}/cava/config"
vars = { tty = false }
process = "cava"
signal = "USR1"

[cava-tty]
template = "cava.j2"
target = "{config_home}/cava/config-tty"
vars = { tty = true }

[banner]
template = "banner.txt.j2"
target = "{config_dir}/generated/banner"
