# NULLGRID: transparent huge pages only for programs that ask for them (madvise).
# With "always" (Arch's default), every heap grows in 2 MB steps: an idle desktop held ~150 MB
# more (Hyprland, kitty, quickshell under software rendering; measured with `make perf`).
w- /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
